[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalrag"
version = "0.1.0"
description = "RAG de derecho colombiano con un modelo abierto pequeño (Hackathon 2026, AI Week)"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
legalrag = "legalrag.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
